# Semantic Identity taxonomy (methodology v0.1)
# Each entry describes what a repository DOES, independent of its name.
# keywords : phrases matched (whole words, case-insensitive) in description / manifest / README
# deps     : dependency names (exact, or prefix when ending in "*") that suggest the type
# topics   : GitHub topics that suggest the type
# Contributions welcome via pull request; keep entries specific to avoid false matches.
version: '0.1'
