id: enterprise
version: '0.1'
title: Enterprise
description: >-
  For adopting third-party software into regulated or large environments. Weights supply chain,
  security and long-term maintenance most heavily, and treats signing, provenance, SBOMs, review
  and license clarity as expected. Solo-maintained projects will score lower by design.
dimension_weights:
  security: 2
  maintenance: 1.5
  code-quality: 1.2
  supply-chain: 2
  community: 0.5
  documentation: 1
  semantic-clarity: 0.5
rule_weights:
  supply-chain.signed-releases: 5
  supply-chain.provenance: 5
  supply-chain.sbom: 4
  supply-chain.license-detected: 6
  security.code-review: 6
  maintenance.bus-factor: 5
minimums:
  security: 70
  supply-chain: 60
  maintenance: 60
  overall: 65
block:
  - id: no-install-time-remote-execution
    description: 'A download-and-execute chain runs automatically at install time'
    when: { fact: { id: execution.chain.install_time, equals: true } }
  - id: no-high-severity-execution-finding
    description: 'A high-severity execution finding exists (code that runs during install or build)'
    when: { finding: { category: execution, min_severity: high } }
  - id: sbom-required
    description: 'No parsable SBOM (CycloneDX or SPDX) is committed'
    when: { fact: { id: deps.sbom.present, equals: false } }
# Requirements compile into blocks. `true` blocks only when the evidence says the requirement is not met; unknown does not block.
require:
  checksums: true
history_block:
  - id: no-new-install-time-remote-execution
    description: 'A revision introduces a download-and-execute path that runs for dependents at install time'
    kind: new_install_time_remote_execution
  - id: no-new-install-hook-after-takeover-indicators
    description: 'A new install-time hook appears while recent history shows takeover risk indicators'
    kind: takeover_indicators_with_new_install_hook
  - id: no-new-vulnerability
    description: 'A revision introduces a dependency with a known advisory'
    kind: new_vulnerability
