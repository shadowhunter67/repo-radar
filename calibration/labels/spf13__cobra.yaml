repository: spf13/cobra
artifact_type: library
artifact_also_acceptable: [framework]
domain: developer-tooling
capabilities:
  {
    PROCESS_EXEC: no,
    NETWORK_CLIENT: no,
    NETWORK_SERVER: no,
    REMOTE_DOWNLOAD: no,
    FILESYSTEM_WRITE: no,
    DYNAMIC_CODE_LOAD: no,
    CREDENTIAL_ACCESS: no,
    ENVIRONMENT_READ: yes,
    BACKGROUND_PROCESS: no,
  }
install_hooks: { automatic: no, names: [] }
persistence: no
hard_coded_secrets: no
ambiguity_notes: 'Process execution and file writes occur only in *_test.go. completions.go contains help TEXT showing `echo ... >> ~/.zshrc` for users: that is documentation inside a string, not persistence code. The Makefile prints a curl install hint inside a warning message.'
