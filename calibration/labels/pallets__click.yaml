repository: pallets/click
artifact_type: library
artifact_also_acceptable: [framework]
domain: developer-tooling
capabilities:
  {
    PROCESS_EXEC: yes,
    NETWORK_CLIENT: no,
    NETWORK_SERVER: no,
    REMOTE_DOWNLOAD: no,
    FILESYSTEM_WRITE: yes,
    DYNAMIC_CODE_LOAD: no,
    CREDENTIAL_ACCESS: no,
    ENVIRONMENT_READ: yes,
    BACKGROUND_PROCESS: no,
  }
install_hooks: { automatic: no, names: [] }
persistence: no
hard_coded_secrets: no
ambiguity_notes: 'Pager and editor launching use subprocess. Build backend is flit_core and there is no setup.py.'
