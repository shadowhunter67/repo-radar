ambiguity_notes: Rust extension built with maturin. build.rs runs when building from source (sdist); wheel users do not run it, hence automatic is ambiguous (labelled yes for source builds). package.json is test tooling for the emscripten runner. wasm-preview/worker.js fetch is an auxiliary demo.
