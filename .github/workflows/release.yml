name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and inspect without publishing
        type: boolean
        default: true
      publish_npm:
        description: Publish npm after human release approval
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: set -euo pipefail; npm ci
        shell: bash
      - run: set -euo pipefail; npm run check
        shell: bash
      - run: set -euo pipefail; npm run build; node scripts/check-release-gates.mjs --online
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
      - run: set -euo pipefail; npm audit --omit=dev --audit-level=high
        shell: bash

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'
          cache: npm
      - run: set -euo pipefail; npm ci; npm run build; mkdir -p release-out; npm pack --silent --pack-destination release-out; npm run package:action; node scripts/check-release-version.mjs release-out/repo-radar-$(node -p "require('./package.json').version").tgz
        shell: bash
      - run: set -euo pipefail; npm sbom --sbom-format cyclonedx --sbom-type application > release-out/sbom.json; node scripts/check-package-content.mjs release-out/*.tgz; node -e "const fs=require('fs'),cp=require('child_process'),p=require('./package.json'); fs.writeFileSync('release-out/release-metadata.json', JSON.stringify({version:p.version,node:process.version,npm:cp.execFileSync('npm',['--version'],{encoding:'utf8'}).trim(),commit:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),commands:['npm run check','npm run build','npm pack','npm run package:action','npm sbom']},null,2)+'\\n')"; (cd release-out && sha256sum -- * > ../SHA256SUMS.tmp) && mv SHA256SUMS.tmp release-out/SHA256SUMS && (cd release-out && sha256sum -c SHA256SUMS)
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-artifacts
          path: release-out/

  attest:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-artifacts
          path: release-out
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release-out/*

  publish:
    needs: [verify, build, attest]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false) }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          set -euo pipefail
          node -e "const p=require('./docs/release/preview-policy.json'); if (!p.allow_experimental_preview_with_unreviewed_calibration || !p.approved_by || !p.approved_on || !p.rationale || p.disclaimer_in_readme !== true) throw new Error('Gate 14 is MANUAL: preview policy is not human-approved'); if (p.public_claims_review !== 'approved') throw new Error('public claims review is not approved')"
        shell: bash
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-artifacts
          path: release-out
      - run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          [ "v${VERSION}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}" >&2; exit 1; }
          gh release create "${GITHUB_REF_NAME}" release-out/* --prerelease --title "repo-radar ${GITHUB_REF_NAME}" --notes-file "docs/release/RELEASE_NOTES_${VERSION}-preview.md"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  # npm publication uses npm TRUSTED PUBLISHING (OIDC): no long-lived npm token exists anywhere. It runs only when the release
  # was dispatched with publish_npm=true AND the preview policy records an approved npm licence review. The trusted publisher
  # (this repository, workflow release.yml, environment release) must first be configured by the package owner on npmjs.com.
  npm-publish:
    needs: publish
    if: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.publish_npm == true }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          set -euo pipefail
          node -e "const p=require('./docs/release/preview-policy.json'); if (p.npm_license_review !== 'approved') throw new Error('npm licence/distribution review is not approved')"
        shell: bash
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # trusted publishing needs npm 11.5.1 or newer
      - run: set -euo pipefail; npm install -g npm@11; npm --version
        shell: bash
      - run: set -euo pipefail; npm ci; npm run build; npm publish --provenance --access public
        shell: bash
