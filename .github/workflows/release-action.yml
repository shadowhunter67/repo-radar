name: release-action

# Packages the Action. `main` does not contain the bundle (dist/ is git-ignored on purpose); a release is a commit
# that adds dist/action/ on top of main and is tagged `action-v<version>`, so consumers use
# `uses: <owner>/repo-radar@action-v<version>`. Manual only; dry run by default.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only build and verify the bundle (no tag, no push)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run bundle
      - id: manifest
        run: |
          node scripts/package-action.mjs
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Smoke-test the bundle exactly as the Action runs it
        run: |
          node dist/action/repo-radar.mjs --version
          set +e
          node dist/action/repo-radar.mjs analyze 'not a repo'
          code=$?
          set -e
          test "$code" = "64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: action-bundle
          path: dist/action/
      - name: Commit the bundle to a release tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          git config user.name "repo-radar release"
          git config user.email "release@repo-radar.invalid"
          git checkout --detach
          git add -f dist/action/repo-radar.mjs dist/action/MANIFEST.json
          git commit -m "release: action bundle ${VERSION}"
          git tag "action-v${VERSION}"
          git push origin "refs/tags/action-v${VERSION}"
