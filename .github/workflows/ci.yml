name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Generated schemas are committed
        run: |
          npm run schemas
          git diff --exit-code -- schemas

  action-matrix:
    # Builds the single-file bundle and runs the composite action (as a consumer would) against real repositories.
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repository:
          - ${{ github.repository }}
          - pallets/flask
          - sindresorhus/execa
          - nvm-sh/nvm
          - octocat/Hello-World
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run package:action
      - id: radar
        uses: ./
        with:
          repository: ${{ matrix.repository }}
          profile: default
          artifact-name: repo-radar-${{ strategy.job-index }}
      - name: Verify the report the Action produced
        env:
          REPORT: ${{ steps.radar.outputs.report-path }}
          CODE: ${{ steps.radar.outputs.exit-code }}
        run: |
          test "$CODE" = "0"
          node -e "
            const r = JSON.parse(require('fs').readFileSync(process.env.REPORT, 'utf8'));
            const ok = r.schema_version === '0.8' && r.code_analysis.scan.performed && r.integrity.report_sha256.length === 64
              && r.dimensions.length === 7 && r.findings.every((f) => f.intent === 'undetermined');
            console.log(r.subject.owner + '/' + r.subject.repo, 'overall', r.overall.score, 'findings', r.findings.length, 'ok', ok);
            process.exit(ok ? 0 : 1);
          "

  action-policy-gate:
    # The Action must FAIL (exit code 2) when a score floor cannot be met, and still upload its report.
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run package:action
      - id: radar
        continue-on-error: true
        uses: ./
        with:
          repository: octocat/Hello-World
          minimum-security-score: '100'
          artifact-name: repo-radar-policy-gate
      - name: The gate failed with exit code 2
        env:
          OUTCOME: ${{ steps.radar.outcome }}
          CODE: ${{ steps.radar.outputs.exit-code }}
        run: |
          test "$OUTCOME" = "failure"
          test "$CODE" = "2"
